name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run verify:releases
      - run: npm run verify:docs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Separate OS package downloads from browser downloads for diagnosis.
      - name: Install browser system dependencies
        timeout-minutes: 15
        run: npx playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run test:demo
      - run: npm run test:upgrade
      - name: Keep isolated browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-browser-evidence
          path: |
            tmp/pairwise-development/*.json
            tmp/pairwise-development/*.png
          retention-days: 14
