name: Bug report / 缺陷反馈
description: Report a reproducible issue with redacted steps
body:
  - type: dropdown
    id: module
    attributes:
      label: Module / 模块
      options:
        - Absolute / 在线绝对打分
        - Pairwise / 离线成对评价
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension and browser versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Exclude keys, work accounts and private customer exports.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error details
